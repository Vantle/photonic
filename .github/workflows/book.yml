name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bazelisk
        run: |
          directory="$RUNNER_TEMP/bazelisk"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-amd64 \
            --output "$directory/bazel"
          printf '%s  %s\n' 22e7d3a188699982f661cf4687137ee52d1f24fec1ec893d91a6c4d791a75de8 "$directory/bazel" | shasum -a 256 --check
          chmod +x "$directory/bazel"
          echo "$directory" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/photonic/bazel
            ~/.cache/bazel/_bazel_runner/cache/repos
          key: book-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}

      - name: Test
        run: bazel test --config=ci //book:record.check //book:route //book:test //toolchain/browser:test

      - name: Build
        run: bazel build --config=ci //book:site

      - name: Locate
        id: site
        run: echo "path=$(bazel info --config=ci bazel-bin)/book/site" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
