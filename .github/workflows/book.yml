name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/photonic/bazel
            ~/.cache/bazel/_bazel_runner/cache/repos
          key: book-${{ github.sha }}
          restore-keys: book-

      - name: Build
        run: bazel build --config=ci //book:site

      - name: Locate
        id: site
        run: echo "path=$(bazel info --config=ci bazel-bin)/book/site" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
