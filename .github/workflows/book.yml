name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bazelisk
        run: |
          directory="$RUNNER_TEMP/bazelisk"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-amd64 \
            --output "$directory/bazel"
          printf '%s  %s\n' 22e7d3a188699982f661cf4687137ee52d1f24fec1ec893d91a6c4d791a75de8 "$directory/bazel" | shasum -a 256 --check
          chmod +x "$directory/bazel"
          echo "$directory" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/photonic/bazel
            ~/.cache/bazel/_bazel_runner/cache/repos
          key: book-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'Cargo.lock') }}

      - name: Build
        run: bazel build --config=ci //book:site

      - name: Locate
        id: site
        run: echo "path=$(bazel info --config=ci bazel-bin)/book/site" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
