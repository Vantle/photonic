name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Bazel
        id: bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build format
        run: bazel test //tool:check
      - name: Rust format
        run: bazel build --config=format //...
      - name: Rust lint
        run: bazel build --config=lint //...

  browser:
    name: Browser
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Bazel
        id: bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Browser
        run: bazel test //tool:browser
      - name: Shutdown
        timeout-minutes: 2
        if: always() && steps.bazel.outcome == 'success'
        run: bazel shutdown

  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            platform: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            platform: x86_64-unknown-linux-gnu
          - runner: windows-11-arm
            platform: aarch64-pc-windows-gnullvm
          - runner: windows-2025
            platform: x86_64-pc-windows-gnullvm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Bazel
        id: bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          bazelrc: ${{ runner.os == 'Windows' && 'common --repo_contents_cache=' || '' }}
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build
        run: bazel build -c opt //... --host_platform=//platform:${{ matrix.platform }} --platforms=//platform:${{ matrix.platform }}
      - name: Formatter
        run: bazel run //:format --host_platform=//platform:${{ matrix.platform }} --platforms=//platform:${{ matrix.platform }} -- --check
      - name: Dependency command
        run: bazel run //:update --host_platform=//platform:${{ matrix.platform }} --platforms=//platform:${{ matrix.platform }} -- --help
      - name: Test
        run: bazel test -c opt //... --host_platform=//platform:${{ matrix.platform }} --platforms=//platform:${{ matrix.platform }}
      - name: Shutdown
        timeout-minutes: 2
        if: always() && steps.bazel.outcome == 'success'
        run: bazel shutdown
