name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and links
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Format
        run: bazel run -c opt //:format -- --check

      - name: Links
        run: bazel run -c opt //:link

      - name: Dependencies
        run: bazel run -c opt //:update -- --workspace --dry-run

  test:
    name: Test · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64-apple-darwin
            runner: macos-15
          - platform: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - platform: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - platform: aarch64-pc-windows-gnullvm
            runner: windows-11-arm
            windows: true
          - platform: x86_64-pc-windows-gnullvm
            runner: windows-2025
            windows: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}-${{ matrix.platform }}
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: ${{ matrix.windows && 'common --repo_contents_cache=' || '' }}

      - name: Test
        run: bazel test -c opt --config=continuous --host_platform=//platform:${{ matrix.platform }} --platforms=//platform:${{ matrix.platform }} //...

  browser:
    name: Browser
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.job }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Browser
        run: bazel test -c opt //book:check
