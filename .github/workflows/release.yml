name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-pc-windows-gnullvm
            runner: windows-11-arm
            windows: true
          - target: x86_64-pc-windows-gnullvm
            runner: windows-2025
            windows: true
    env:
      TARGET: ${{ matrix.target }}
      WINDOWS: ${{ matrix.windows }}
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.28.1
          repository-cache: true
          bazelrc: ${{ matrix.windows && 'common --repo_contents_cache=' || '' }}

      - name: Version
        id: version
        run: |
          version="$(sed -n '/^module(/,/^)/s/^    version = "\(.*\)",$/\1/p' MODULE.bazel)"
          if [[ -z "$version" ]]; then
            echo "MODULE.bazel names no module version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match module version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          flags=(-c opt --output_groups=-check "--host_platform=//platform:$TARGET" "--platforms=//platform:$TARGET")
          bazel build "${flags[@]}" //:release //:notice
          root="$(bazel info execution_root)"
          mkdir -p "$RUNNER_TEMP/build"
          cp "$root/$(bazel cquery "${flags[@]}" --output=files //:release)" "$RUNNER_TEMP/build/"
          cp "$root/$(bazel cquery "${flags[@]}" --output=files //:notice)" "$RUNNER_TEMP/build/THIRD-PARTY-NOTICES.txt"

      - name: Smoke
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="$RUNNER_TEMP/build/photonic"
          if [[ "$WINDOWS" == true ]]; then
            binary="$binary.exe"
          fi
          reported="$("$binary" --version | tr -d '\r')"
          if [[ "$reported" != "photonic $VERSION" ]]; then
            echo "The binary reports '$reported', expected 'photonic $VERSION'" >&2
            exit 1
          fi
          printf 'Light,\n[Light] Red,\n[Light] Green,\n[Light] Blue\n' > "$RUNNER_TEMP/light.wave"
          "$binary" check "$RUNNER_TEMP/light.wave" --reach Red --avoid Red.Green
          if "$binary" check "$RUNNER_TEMP/light.wave" --plain --end Red; then
            echo "Every run was claimed to end at Red, but a run can end at Green" >&2
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="photonic-$VERSION-$TARGET"
          staging="$RUNNER_TEMP/staging/$name"
          mkdir -p "$staging" "$RUNNER_TEMP/package"
          cp "$RUNNER_TEMP"/build/* LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$staging/"
          if [[ "$WINDOWS" == true ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$staging' -DestinationPath '$RUNNER_TEMP/package/$name.zip'"
          else
            tar -czf "$RUNNER_TEMP/package/$name.tar.gz" -C "$RUNNER_TEMP/staging" "$name"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: package
          merge-multiple: true

      - name: Checksum
        run: |
          cd package
          sha256sum -- * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/*

      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" package/* \
            --draft \
            --verify-tag \
            --title "Photonic ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
