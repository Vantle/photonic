[package]
name = "frontend"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "frontend.rs"

[dependencies]
miette = { version = "7", features = ["fancy-no-backtrace"] }
pest = "2.9"
pest_derive = "2.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[[test]]
name = "frontend"
path = "test/suite.rs"

[dev-dependencies]
serde_json = "1"
