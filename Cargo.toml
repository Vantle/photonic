[package]
name = "molten"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "system/molten/molten.rs"

[[bin]]
name = "molten"
path = "system/molten/command/command.rs"

[[bin]]
name = "benchmark"
path = "system/molten/benchmark/benchmark.rs"

[[test]]
name = "test"
path = "system/molten/test/test.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
miette = { version = "7", features = ["fancy-no-backtrace"] }
pest = "2.9"
pest_derive = "2.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
