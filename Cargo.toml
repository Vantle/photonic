[package]
name = "photonic"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "language/photonic.rs"

[[bin]]
name = "photonic"
path = "command/main.rs"

[[bin]]
name = "benchmark"
path = "benchmark/runtime.rs"

[features]
measurement = []

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
miette = { version = "7", features = ["fancy-no-backtrace"] }
pest = "2.9"
pest_derive = "2.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
