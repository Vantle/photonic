[package]
name = "molten"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "system/molten/molten.rs"

[[bin]]
name = "molten"
path = "system/molten/command/command.rs"

[[bin]]
name = "benchmark"
path = "system/molten/benchmark/benchmark.rs"

[[test]]
name = "parser"
path = "system/molten/test/parser.rs"

[[test]]
name = "particle"
path = "system/molten/test/particle.rs"

[[test]]
name = "rule"
path = "system/molten/test/rule.rs"

[[test]]
name = "lowering"
path = "system/molten/test/lowering.rs"

[[test]]
name = "runtime"
path = "system/molten/test/runtime.rs"

[[test]]
name = "command"
path = "system/molten/test/command.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
miette = { version = "7", features = ["fancy-no-backtrace"] }
pest = "2.9"
pest_derive = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
